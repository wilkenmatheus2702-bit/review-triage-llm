[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-triage-llm"
version = "1.0.0"
description = "LLM triage of Portuguese customer reviews with structured output, human review, audit log and evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matheus Legnani Wilken" }]
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.6",
    "pandas>=2.1",
    "duckdb>=1.1",
    "matplotlib>=3.7",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["review_triage"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
